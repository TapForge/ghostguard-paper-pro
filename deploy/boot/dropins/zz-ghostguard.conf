# GhostGuard rescue hook, kept in XOVI's template: XOVI copies it into the xochitl drop-in tmpfs at every start
# and xovi/stock takes it away with the tmpfs, so stock xochitl never has it. OnFailure= only ADDS the rescue unit
# next to the stock emergency.target (a drop-in cannot reset OnFailure=, verified on the device for v7.1). The
# name must sort after xochitl-service-override.conf. (Keep the library's name out of this file: the deploy
# scripts refuse to run when they find it in XOVI's template.)
[Unit]
OnFailure=ghostguard-rescue.service
