# GhostGuard: staged into XOVI's template by autostart.sh for one xovi/start only (then removed from the template;
# the copy in the drop-in tmpfs lives until xovi/stock or the next reboot). Preloads the boot's own pinned copy of
# the library (installed by persist_install.sh), so a library deployed by hand never changes what boots.
[Service]
Environment="LD_PRELOAD=/home/root/xovi/xovi.so /home/root/ghostguard/boot/ggsense.so"
Environment="GGSENSE_DEBUG=1"
